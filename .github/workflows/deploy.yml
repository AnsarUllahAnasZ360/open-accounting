name: Deploy

on:
  push:
    branches: [main]

# Never cancel an in-flight production deploy.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production:
    name: Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel

      # Downloads project config + production env vars into .vercel/
      - name: Pull Vercel project settings (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Convex deploys to production, injects its URL as NEXT_PUBLIC_CONVEX_URL,
      # then runs `vercel build` so Next.js bakes in the correct URL at build time.
      - name: Deploy Convex (production) + build
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          pnpm exec convex deploy \
            --cmd-url-env-var-name NEXT_PUBLIC_CONVEX_URL \
            --cmd "vercel build --prod --yes --token=$VERCEL_TOKEN"

      - name: Deploy to Vercel (production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
