name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup reads the version from the "packageManager" field
      # in package.json (pnpm@10.26.2), so it stays in lockstep with local dev.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck (web)
        run: pnpm typecheck

      - name: Typecheck (Convex)
        run: pnpm typecheck:convex

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Placeholder for the CI compile check — the real URL is baked in at
          # deploy time (see deploy.yml / preview.yml).
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL || 'https://placeholder.convex.cloud' }}

  changeset:
    name: Changeset Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changeset
        id: check
        run: |
          BASE="${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "origin/$BASE"...HEAD | grep "^\.changeset/.*\.md$" | grep -v "README\.md" || true)
          if [ -z "$CHANGED" ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
            echo "Changeset found: $CHANGED"
          fi

      - name: Comment if changeset missing
        if: steps.check.outputs.missing == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '> [!WARNING]',
              '> **No changeset detected.**',
              '>',
              '> If this PR introduces a feature or bug fix, run `pnpm changeset` and commit the generated file before merging.',
              '>',
              '> You can skip this for `chore:`, `docs:`, or `ci:` changes with no user-facing impact.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes('No changeset detected')
            );

            if (!existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
