name: Preview Deploy

# Ephemeral, on-demand previews. Two ways to trigger:
#   1. Comment "/preview" on an open PR  -> deploys that PR's head commit.
#   2. Actions -> "Preview Deploy" -> Run workflow  -> deploys a named branch.
# A closed PR triggers best-effort cleanup of its Vercel preview.
#
# Required repo secrets:
#   CONVEX_PREVIEW_DEPLOY_KEY  (Convex "Preview" deploy key)
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy as a preview"
        required: true
        type: string
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  VERCEL_CLI_VERSION: "50.28.0"
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy Preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '/preview')) ||
      github.event_name == 'workflow_dispatch'
    concurrency:
      group: preview-deploy-${{ github.event.issue.number || github.event.inputs.branch }}
      cancel-in-progress: true
    steps:
      - name: React to preview comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

      - name: Resolve preview context
        id: preview
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            // Convex + Vercel preview names: lowercase alphanumerics + hyphens.
            const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '').slice(0, 40);

            if (context.eventName === 'issue_comment') {
              const prNumber = context.issue.number;
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              if (pr.state !== 'open') {
                core.setFailed(`PR #${prNumber} is not open.`);
                return;
              }
              core.setOutput('pr_number', String(prNumber));
              core.setOutput('branch', pr.head.ref);
              core.setOutput('checkout_ref', pr.head.sha);
              core.setOutput('sha', pr.head.sha);
              core.setOutput('preview_key', `pr-${prNumber}`);
              return;
            }

            const branch = context.payload.inputs.branch;
            const { data: branchData } = await github.rest.repos.getBranch({ owner, repo, branch });
            core.setOutput('branch', branch);
            core.setOutput('checkout_ref', branchData.commit.sha);
            core.setOutput('sha', branchData.commit.sha);
            core.setOutput('preview_key', `br-${slug(branch)}`);

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.preview.outputs.checkout_ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Vercel CLI
        run: pnpm add -g vercel@${VERCEL_CLI_VERSION}

      - name: Typecheck
        run: pnpm typecheck && pnpm typecheck:convex

      - name: Pull Vercel project settings (preview)
        run: >-
          vercel pull --yes --environment=preview
          --git-branch="${{ steps.preview.outputs.branch }}"
          --token=${{ secrets.VERCEL_TOKEN }}

      # Convex deploys to a named preview backend, injects its URL as
      # NEXT_PUBLIC_CONVEX_URL, then runs `vercel build` so Next.js bakes in the
      # correct backend URL at build time.
      - name: Deploy Convex preview + Vercel build
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          pnpm exec convex deploy \
            --preview-create "${{ steps.preview.outputs.preview_key }}" \
            --cmd-url-env-var-name NEXT_PUBLIC_CONVEX_URL \
            --cmd "vercel build --yes --token=$VERCEL_TOKEN"

      - name: Deploy to Vercel preview
        id: deploy
        run: |
          set -euo pipefail
          URL=$(vercel deploy --prebuilt \
            --meta previewKey="${{ steps.preview.outputs.preview_key }}" \
            --meta previewBranch="${{ steps.preview.outputs.branch }}" \
            --token=${{ secrets.VERCEL_TOKEN }})
          URL=$(echo "$URL" | tail -n 1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        run: |
          {
            echo "### Preview Deployment"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| URL | ${{ steps.deploy.outputs.url }} |"
            echo "| Convex preview | ${{ steps.preview.outputs.preview_key }} |"
            echo "| Branch | ${{ steps.preview.outputs.branch }} |"
            echo "| Commit | ${{ steps.preview.outputs.sha }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const sha = '${{ steps.preview.outputs.sha }}'.slice(0, 7);
            const branch = '${{ steps.preview.outputs.branch }}';
            const key = '${{ steps.preview.outputs.preview_key }}';
            const body = [
              '### Preview Deployment',
              '',
              '| | |',
              '|---|---|',
              `| **URL** | ${url} |`,
              `| **Convex** | \`${key}\` |`,
              `| **Commit** | \`${sha}\` |`,
              `| **Branch** | \`${branch}\` |`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes('Preview Deployment')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  cleanup:
    name: Cleanup PR Preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    concurrency:
      group: preview-cleanup-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      # Vercel automatically retires preview deployments for a PR once it is
      # closed, and Convex `--preview-create` backends expire on their own, so
      # this job only records what to check. Targeted teardown (deleting the
      # exact Convex preview + its Vercel snapshots) needs the Convex management
      # API and a per-key filter — ask if you want that helper script added.
      - name: Note cleanup
        run: |
          {
            echo "### Preview Cleanup"
            echo ""
            echo "PR #${{ github.event.pull_request.number }} closed."
            echo ""
            echo "- Vercel retires PR preview deployments automatically."
            echo "- Delete the \`pr-${{ github.event.pull_request.number }}\` Convex preview from the Convex dashboard if it lingers."
          } >> "$GITHUB_STEP_SUMMARY"
